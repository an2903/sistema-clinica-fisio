<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Funcionários | Clínica Fisio</title>
    <!-- Link do Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm" style="background:#20b2aa;">

        <div class="container">

            <a class="navbar-brand fw-bold" href="#">
                🏥 Clínica Fisio
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="menu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link active" href="#">Painel</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="cad-pacientes.html">Cadastros</a>
                    </li>

                    <li class="nav-item ms-3">

                        <span class="badge bg-light text-dark">

                            👤 Administrador

                        </span>

                    </li>

                </ul>

            </div>

        </div>

    </nav>
    <div class="container mt-5">
        <div class="card shadow-sm max-w-md mx-auto">
            <div class="card-header bg-secondary text-white">
                <h3 class="mb-0">Cadastro de Funcionário</h3>
            </div>
            <div class="card-body">
                <form id="formFuncionario">

                    <div class="mb-3">
                        <label for="nomeFuncionario" class="form-label">Nome Completo</label>
                        <input type="text" class="form-control" id="nomeFuncionario" placeholder="Ex: Maria Oliveira"
                            required>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="cpfFuncionario" class="form-label">CPF</label>
                            <input type="text" class="form-control" id="cpfFuncionario" placeholder="000.000.000-00"
                                required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="telefoneFuncionario" class="form-label">Telefone / WhatsApp</label>
                            <input type="tel" class="form-control" id="telefoneFuncionario"
                                placeholder="(00) 00000-0000" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="cargoFuncionario" class="form-label">Cargo na Clínica</label>
                        <select class="form-select" id="cargoFuncionario" required>
                            <option value="" selected disabled>Selecione a função...</option>
                            <option value="recepcionista">Recepcionista</option>
                            <option value="administrador">Administrador(a)</option>
                            <option value="auxiliar_limpeza">Auxiliar de Limpeza</option>
                            <option value="gerente">Gerente</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-secondary w-100">Salvar Funcionário</button>
                </form>
                <hr class="my-4">

                <h4>Funcionários Cadastrados</h4>


                <div class="table-responsive">

                    <table class="table table-striped table-hover">

                        <thead class="table-secondary">

                            <tr>

                                <th>Nome</th>
                                <th>CPF</th>
                                <th>Cargo</th>
                                <th width="120">Ações</th>

                            </tr>

                        </thead>

                        <tbody id="listaFuncionarios">

                        </tbody>

                    </table>

                </div>
            </div>
        </div>
        <div class="mt-3 text-center">
            <a href="index.html" class="text-decoration-none">Voltar para o Início</a>
        </div>
    </div>


 <footer class="bg-dark text-white mt-5">

        <div class="container text-center py-4">

            <h5>🏥 Clínica Fisio</h5>

            <p>

                Sistema de Gestão para Clínicas de Fisioterapia

            </p>

            <small>

                Desenvolvido para a disciplina de Gerência de Projetos • 2026

            </small>

        </div>

    </footer>
    <script src="../js/app.js"></script>
</body>

</html>
