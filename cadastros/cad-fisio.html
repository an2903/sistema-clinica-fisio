<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Fisioterapeutas | Clínica Fisio</title>
    <!-- Link do Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="card shadow-sm max-w-md mx-auto">
            <div class="card-header bg-primary text-white">
                <h3 class="mb-0">Cadastro de Fisioterapeuta</h3>
            </div>
            <div class="card-body">
                <form id="formFisio">
                    
                    <div class="mb-3">
                        <label for="nomeFisio" class="form-label">Nome Completo</label>
                        <input type="text" class="form-control" id="nomeFisio" placeholder="Ex: João da Silva" required>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="cpfFisio" class="form-label">CPF</label>
                            <input type="text" class="form-control" id="cpfFisio" placeholder="000.000.000-00" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="crefitoFisio" class="form-label">Registro CREFITO</label>
                            <input type="text" class="form-control" id="crefitoFisio" placeholder="Ex: 123456-F" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="telefoneFisio" class="form-label">Telefone / WhatsApp</label>
                            <input type="tel" class="form-control" id="telefoneFisio" placeholder="(00) 00000-0000" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="especialidadeFisio" class="form-label">Especialidade Principal</label>
                            <select class="form-select" id="especialidadeFisio" required>
                                <option value="" selected disabled>Selecione...</option>
                                <option value="ortopedia">Traumato-Ortopedia</option>
                                <option value="neurologia">Neurologia</option>
                                <option value="respiratoria">Respiratória</option>
                                <option value="pilates">Pilates Clínico</option>
                                <option value="rpg">RPG</option>
                            </select>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-success w-100">Salvar Fisioterapeuta</button>
                </form>
            </div>
        </div>
        <div class="mt-3 text-center">
            <a href="index.html" class="text-decoration-none">Voltar para o Início</a>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
