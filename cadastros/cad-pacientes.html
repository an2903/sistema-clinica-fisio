<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Pacientes | Clínica Fisio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="card shadow-sm max-w-md mx-auto">
            <div class="card-header bg-primary text-white">
                <h3 class="mb-0">Cadastro de Paciente</h3>
            </div>
            <div class="card-body">
                <form id="formPaciente">
                    
                    <div class="mb-3">
                        <label for="nomePaciente" class="form-label">Nome Completo</label>
                        <input type="text" class="form-control" id="nomePaciente" placeholder="Ex: Ana Maria Silva" required>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="cpfPaciente" class="form-label">CPF</label>
                            <input type="text" class="form-control" id="cpfPaciente" placeholder="000.000.000-00" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="dataNascPaciente" class="form-label">Data de Nascimento</label>
                            <input type="date" class="form-control" id="dataNascPaciente" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="historicoPaciente" class="form-label">Histórico Clínico Prévio</label>
                        <textarea class="form-control" id="historicoPaciente" rows="3" placeholder="Cirurgias, dores crônicas, lesões anteriores..."></textarea>
                    </div>

                    <button type="submit" class="btn btn-success w-100">Salvar Cadastro</button>
                </form>
            </div>
        </div>
        <div class="mt-3 text-center">
            <a href="index.html" class="text-decoration-none">Voltar para o Início</a>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
