<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <title>Painel | Clínica Fisio</title>
    <!-- Link do Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

<body class="bg-light">

    <!-- Barra de Navegação Superior -->
